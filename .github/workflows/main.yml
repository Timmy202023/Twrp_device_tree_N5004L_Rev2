name: Build TWRP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # This is required to create releases
    steps:
    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
  
    - name: Checkout
      uses: actions/checkout@v3

    - name: Build
      run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses-dev x11proto-core-dev libx11-dev lib32z-dev ccache libgl1-mesa-dev libxml2-utils xsltproc unzip python3 bc rsync
          # Install repo tool
            mkdir -p ~/bin
            curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
            chmod a+x ~/bin/repo
            export PATH=~/bin:$PATH
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
          repo sync -c --no-tags --no-clone-bundle -j$(nproc) --force-sync
          source build/envsetup.sh
          lunch omni_n5004l-eng
          mka recoveryimage

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
          files: twrp/out/target/product/n5004l/recovery.img
          tag_name: TWRP-v12.1-${{ github.run_number }}
          name: TWRP v12.1 Build ${{ github.run_number }}
          body: "Automatic build of TWRP for NUU N5004L."
